# Mosquitto configuration for the RoadScope demo.
#
# Homebrew installs an empty mosquitto.conf, and Mosquitto 2.x defaults to
# `allow_anonymous false`. With that default both the agent and the receiver
# connect at TCP level and are then refused, so the agent buffers forever and
# the server shows nothing. This file is the smallest config that works.
#
# Bind to loopback: the agent and the receiver both run on the laptop. The
# phone only serves MJPEG and never talks MQTT. Do not widen this to 0.0.0.0
# without adding a password file.

listener 1883 127.0.0.1
allow_anonymous true

# No persistence: a demo should start from a clean broker, and the agent's
# outbox is the durable queue. Retained last-will messages are still held in
# memory for the lifetime of the process.
persistence false

log_type error
log_type warning
log_type notice
log_dest stdout
